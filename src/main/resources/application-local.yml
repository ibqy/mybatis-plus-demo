# 断网/不在公司内网时显式启用：--spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:mp_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:local-schema.sql
      data-locations: classpath:local-data.sql
